name: Temporary off-api search patch

on:
  push:
    branches:
      - off-api
    paths:
      - .github/workflows/tmp-off-api-search-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: off-api
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Patch search URL and file drop handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('static/index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          """function setSearchQueryParam(q) {
            const url = new URL(location.href);
            if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
            history.replaceState(null, '', url);
          }
          """,
          """function setSearchQueryParam(q) {
            const url = new URL(location.href);
            if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
            history.replaceState(null, '', url);
          }

          function isSupportedRemoteMediaUrl(value) {
            try {
              const url = new URL(String(value ?? '').trim());
              if (!['http:', 'https:'].includes(url.protocol)) return false;
              const host = url.hostname.toLowerCase().replace(/^www\\./, '');
              if (host === 'youtu.be') return url.pathname.length > 1;
              if (host === 'youtube.com' || host.endsWith('.youtube.com')) return url.pathname.length > 1 || !!url.searchParams.get('v');
              if (host === 'soundcloud.com' || host.endsWith('.soundcloud.com')) return url.pathname.length > 1;
              return false;
            } catch {
              return false;
            }
          }
          """,
          'URL helper',
          )

          replace_once(
          """  if (mainEl.classList.contains('sidebar-collapsed')) {
            mainEl.classList.remove('sidebar-collapsed');
            localStorage.removeItem('jw_sidebar');
          }
          searchTimer = setTimeout(() => doSearch(q), 380);
          });
          """,
          """  if (isSupportedRemoteMediaUrl(q)) {
            resultsHeaderText.textContent = 'Media link detected';
            renderSearchState('Opening media link', 'Downloading the audio locally with yt-dlp…');
            searchTimer = setTimeout(() => loadRemoteTrackUrl(q, { fromSearch: true }), 380);
            return;
          }
          if (mainEl.classList.contains('sidebar-collapsed')) {
            mainEl.classList.remove('sidebar-collapsed');
            localStorage.removeItem('jw_sidebar');
          }
          searchTimer = setTimeout(() => doSearch(q), 380);
          });

          const searchDropTarget = searchInput.closest('.search-wrap') || searchInput;
          searchDropTarget.addEventListener('dragover', (e) => {
            if (!Array.from(e.dataTransfer?.types ?? []).includes('Files')) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
          });
          searchDropTarget.addEventListener('drop', async (e) => {
            const file = e.dataTransfer?.files?.[0];
            if (!file) return;
            e.preventDefault();
            clearTimeout(searchTimer);
            searchGeneration++;
            searchInput.value = '';
            setSearchQueryParam('');
            await uploadLocalFile(file, { fromSearch: true });
          });
          """,
          'search input handling',
          )

          replace_once(
          """async function uploadLocalFile(file) {
            localBrowseBtn.disabled = true;
            localUrlLoadBtn.disabled = true;
            localLandingStatus.className = '';
            localLandingStatus.textContent = `Reading ${file.name}…`;
            try {
              const fd = new FormData();
              fd.append('file', file);
              const r = await fetch('/api/upload', { method: 'POST', body: fd });
              if (!r.ok) throw new Error(await r.text());
              const meta = await r.json();
              localLandingStatus.className = 'ok';
              localLandingStatus.textContent = 'Audio ready ✓';
              await loadLocalTrack(meta);
            } catch (e) {
              localLandingStatus.className = 'error';
              localLandingStatus.textContent = 'Could not open that file: ' + (e.message ?? e);
            } finally {
              localBrowseBtn.disabled = false;
              localUrlLoadBtn.disabled = false;
            }
          }
          """,
          """async function uploadLocalFile(file, { fromSearch = false } = {}) {
            localBrowseBtn.disabled = true;
            localUrlLoadBtn.disabled = true;
            localLandingStatus.className = '';
            localLandingStatus.textContent = `Reading ${file.name}…`;
            if (fromSearch) {
              resultsHeaderText.textContent = `Opening ${file.name}…`;
              renderSearchSkeleton();
            }
            try {
              const fd = new FormData();
              fd.append('file', file);
              const r = await fetch('/api/upload', { method: 'POST', body: fd });
              if (!r.ok) throw new Error(await r.text());
              const meta = await r.json();
              localLandingStatus.className = 'ok';
              localLandingStatus.textContent = 'Audio ready ✓';
              await loadLocalTrack(meta);
            } catch (e) {
              localLandingStatus.className = 'error';
              localLandingStatus.textContent = 'Could not open that file: ' + (e.message ?? e);
              if (fromSearch) {
                resultsHeaderText.textContent = 'Could not open file';
                renderSearchState('Could not open that file', String(e.message ?? e));
              }
            } finally {
              localBrowseBtn.disabled = false;
              localUrlLoadBtn.disabled = false;
            }
          }
          """,
          'local file upload',
          )

          replace_once(
          """localUrlForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = localUrlInput.value.trim();
            if (!url) return;
            localBrowseBtn.disabled = true;
            localUrlLoadBtn.disabled = true;
            localUrlInput.disabled = true;
            localLandingStatus.className = '';
            localLandingStatus.textContent = 'Downloading audio URL locally…';
            try {
              const meta = await api('/api/local-url', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url })
              }, 240_000);
              localLandingStatus.className = 'ok';
              localLandingStatus.textContent = 'Audio ready ✓';
              await loadLocalTrack(meta);
              localUrlInput.value = '';
            } catch (err) {
              localLandingStatus.className = 'error';
              localLandingStatus.textContent = 'Could not load URL: ' + (err.message ?? err);
            } finally {
              localBrowseBtn.disabled = false;
              localUrlLoadBtn.disabled = false;
              localUrlInput.disabled = false;
            }
          });
          """,
          """async function loadRemoteTrackUrl(url, { fromSearch = false } = {}) {
            const cleanUrl = String(url ?? '').trim();
            if (!cleanUrl) return;
            if (fromSearch) {
              searchInput.disabled = true;
              searchModeBtn.disabled = true;
              resultsHeaderText.textContent = 'Opening media link…';
              renderSearchSkeleton();
            } else {
              localBrowseBtn.disabled = true;
              localUrlLoadBtn.disabled = true;
              localUrlInput.disabled = true;
              localLandingStatus.className = '';
              localLandingStatus.textContent = 'Downloading audio URL locally…';
            }
            try {
              const meta = await api('/api/local-url', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: cleanUrl })
              }, 240_000);
              localLandingStatus.className = 'ok';
              localLandingStatus.textContent = 'Audio ready ✓';
              await loadLocalTrack(meta);
              if (fromSearch) {
                searchInput.value = '';
                setSearchQueryParam('');
              } else {
                localUrlInput.value = '';
              }
            } catch (err) {
              if (fromSearch) {
                resultsHeaderText.textContent = 'Could not open media link';
                renderSearchState('Could not open media link', String(err.message ?? err));
              } else {
                localLandingStatus.className = 'error';
                localLandingStatus.textContent = 'Could not load URL: ' + (err.message ?? err);
              }
            } finally {
              if (fromSearch) {
                searchInput.disabled = false;
                searchModeBtn.disabled = false;
              } else {
                localBrowseBtn.disabled = false;
                localUrlLoadBtn.disabled = false;
                localUrlInput.disabled = false;
              }
            }
          }

          localUrlForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await loadRemoteTrackUrl(localUrlInput.value);
          });
          """,
          'remote URL loader',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('static/index.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/wrld-sync-index.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/wrld-sync-index.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/index.html
          git diff --cached --check
          git commit -m 'Open media URLs and dropped files from search'
          git push origin HEAD:off-api
