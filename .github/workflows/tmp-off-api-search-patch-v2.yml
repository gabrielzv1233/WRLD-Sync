name: Temporary off-api search patch v2

on:
  push:
    branches:
      - off-api
    paths:
      - .github/workflows/tmp-off-api-search-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: off-api
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Patch search URL and file drop handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('static/index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          search_state_anchor = "function renderSearchState(title, detail) {"
          url_helper = """function isSupportedRemoteMediaUrl(value) {
            try {
              const url = new URL(String(value ?? '').trim());
              if (!['http:', 'https:'].includes(url.protocol)) return false;
              const host = url.hostname.toLowerCase().replace(/^www\\./, '');
              if (host === 'youtu.be') return url.pathname.length > 1;
              if (host === 'youtube.com' || host.endsWith('.youtube.com')) return url.pathname.length > 1 || !!url.searchParams.get('v');
              if (host === 'soundcloud.com' || host.endsWith('.soundcloud.com')) return url.pathname.length > 1;
              return false;
            } catch {
              return false;
            }
          }

          """
          replace_once(search_state_anchor, url_helper + search_state_anchor, 'URL helper anchor')

          search_tail = "  searchTimer = setTimeout(() => doSearch(q), 380);\n});\n\nasync function doSearch(q) {"
          search_tail_new = """  if (isSupportedRemoteMediaUrl(q)) {
            resultsHeaderText.textContent = 'Media link detected';
            renderSearchState('Opening media link', 'Downloading the audio locally with yt-dlp…');
            searchTimer = setTimeout(() => loadRemoteTrackUrl(q, { fromSearch: true }), 380);
            return;
          }
          searchTimer = setTimeout(() => doSearch(q), 380);
          });

          const searchDropTarget = searchInput.closest('.search-wrap') || searchInput;
          searchDropTarget.addEventListener('dragover', (e) => {
            if (!Array.from(e.dataTransfer?.types ?? []).includes('Files')) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
          });
          searchDropTarget.addEventListener('drop', async (e) => {
            const file = e.dataTransfer?.files?.[0];
            if (!file) return;
            e.preventDefault();
            clearTimeout(searchTimer);
            searchGeneration++;
            searchInput.value = '';
            setSearchQueryParam('');
            await uploadLocalFile(file, { fromSearch: true });
          });

          async function doSearch(q) {"""
          replace_once(search_tail, search_tail_new, 'search handler tail')

          replace_once('async function uploadLocalFile(file) {', 'async function uploadLocalFile(file, { fromSearch = false } = {}) {', 'upload signature')
          replace_once(
              "  localLandingStatus.textContent = `Reading ${file.name}…`;\n  try {",
              "  localLandingStatus.textContent = `Reading ${file.name}…`;\n  if (fromSearch) {\n    resultsHeaderText.textContent = `Opening ${file.name}…`;\n    renderSearchSkeleton();\n  }\n  try {",
              'upload search loading state',
          )
          replace_once(
              "    localLandingStatus.textContent = 'Could not open that file: ' + (e.message ?? e);\n  } finally {",
              "    localLandingStatus.textContent = 'Could not open that file: ' + (e.message ?? e);\n    if (fromSearch) {\n      resultsHeaderText.textContent = 'Could not open file';\n      renderSearchState('Could not open that file', String(e.message ?? e));\n    }\n  } finally {",
              'upload search error state',
          )

          form_start = "localUrlForm.addEventListener('submit', async (e) => {"
          form_end = "// Keep the demo's animated save/check artwork while persisting the real token."
          start = text.find(form_start)
          end = text.find(form_end, start)
          if start < 0 or end < 0:
              raise SystemExit('remote URL form anchors not found')
          remote_loader = """async function loadRemoteTrackUrl(url, { fromSearch = false } = {}) {
            const cleanUrl = String(url ?? '').trim();
            if (!cleanUrl) return;
            if (fromSearch) {
              searchInput.disabled = true;
              searchModeBtn.disabled = true;
              resultsHeaderText.textContent = 'Opening media link…';
              renderSearchSkeleton();
            } else {
              localBrowseBtn.disabled = true;
              localUrlLoadBtn.disabled = true;
              localUrlInput.disabled = true;
              localLandingStatus.className = '';
              localLandingStatus.textContent = 'Downloading audio URL locally…';
            }
            try {
              const meta = await api('/api/local-url', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: cleanUrl })
              }, 240_000);
              localLandingStatus.className = 'ok';
              localLandingStatus.textContent = 'Audio ready ✓';
              await loadLocalTrack(meta);
              if (fromSearch) {
                searchInput.value = '';
                setSearchQueryParam('');
              } else {
                localUrlInput.value = '';
              }
            } catch (err) {
              if (fromSearch) {
                resultsHeaderText.textContent = 'Could not open media link';
                renderSearchState('Could not open media link', String(err.message ?? err));
              } else {
                localLandingStatus.className = 'error';
                localLandingStatus.textContent = 'Could not load URL: ' + (err.message ?? err);
              }
            } finally {
              if (fromSearch) {
                searchInput.disabled = false;
                searchModeBtn.disabled = false;
              } else {
                localBrowseBtn.disabled = false;
                localUrlLoadBtn.disabled = false;
                localUrlInput.disabled = false;
              }
            }
          }

          localUrlForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await loadRemoteTrackUrl(localUrlInput.value);
          });

          """
          text = text[:start] + remote_loader + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('static/index.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/wrld-sync-index.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/wrld-sync-index.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/index.html
          git diff --cached --check
          git commit -m 'Open media URLs and dropped files from search'
          git push origin HEAD:off-api
