name: Temporary yt-dlp metadata patch

on:
  push:
    branches:
      - UI

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: UI

      - name: Patch yt-dlp metadata handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          needle = '    proc = subprocess.run(cmd, capture_output=True, text=True)\n'
          insert = '''    service = _yt_dlp_service(url) or "Remote media"
              metadata_args = ["--embed-metadata"]
              if service in {"YouTube", "YouTube Music"}:
                  metadata_args += [
                      "--parse-metadata", "%(title|)s:%(meta_title)s",
                      "--parse-metadata", "%(uploader|)s:%(meta_artist)s",
                  ]
              cmd[-1:-1] = metadata_args
          '''.replace("              ", "    ")

          if needle not in text:
              raise SystemExit("Expected yt-dlp subprocess call not found")
          if 'cmd[-1:-1] = metadata_args' not in text:
              text = text.replace(needle, insert + needle, 1)
          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile app.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Embed source metadata for yt-dlp downloads"
          git push origin HEAD:UI
